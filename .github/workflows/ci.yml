name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    # ubuntu-latest ships shellcheck preinstalled; macos-latest doesn't.
    # shellcheck itself only parses the script text — it doesn't need to
    # run on macOS even though the scripts are macOS-only at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/sail install.sh uninstall.sh lib/fix-webtorrent.sh lib/wlist.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install webtorrent-cli
        run: |
          npm install -g webtorrent-cli
          bash lib/fix-webtorrent.sh
      - name: run tests
        run: |
          python3 -m unittest discover tests -v
          bash tests/test_fix_webtorrent.sh
          bash tests/test_wlist.sh
          bash tests/test_wlist_ui.sh
          bash tests/test_wt_meta.sh
          bash tests/test_wt_cleanup.sh
          bash tests/test_sources_ui.sh
          bash tests/test_dashboard.sh
          bash tests/test_cli.sh
          bash tests/test_uninstall.sh
