name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    # ubuntu-latest ships shellcheck preinstalled; macos-latest doesn't.
    # shellcheck itself only parses the script text — it doesn't need to
    # run on macOS even though the scripts are macOS-only at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/sail install.sh uninstall.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: run tests
        run: python3 -m unittest discover tests -v
