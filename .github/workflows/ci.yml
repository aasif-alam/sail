name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/sail install.sh uninstall.sh

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: run tests
        run: python3 -m unittest discover tests -v
