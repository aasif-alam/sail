name: CI

on:
  push:
  pull_request:

# a new push to the same branch cancels the run it supersedes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    # ubuntu-latest ships shellcheck and node; the scripts are macOS-only at
    # runtime, but linting only reads text
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck
        # -x follows the `source=` directives from bin/sail, so the UI and
        # torrent libraries are covered without linting them standalone
        # (their globals are consumed by the caller and read as unused there)
        run: shellcheck -x -P SCRIPTDIR bin/sail install.sh uninstall.sh lib/*.sh tests/*.sh
      - name: node --check
        run: node --check lib/wt.js
      - name: python syntax and lint
        run: |
          python3 -m py_compile lib/search.py tests/*.py
          python3 -m pip install --user --break-system-packages ruff==0.17.1
          python3 -m ruff check --isolated --select E4,E7,E9,F lib tests
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  test:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cache homebrew downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-tmux-webtorrent-v1
          restore-keys: |
            brew-${{ runner.os }}-
      - name: install test dependencies
        # homebrew, mirroring install.sh — `npm install -g` broke when the
        # webtorrent dep ip-set@3 shipped a preinstall gate that hard-fails
        # any npm install (only-allow pnpm). brew vendors the module tree so
        # `command -v webtorrent` + walk-up discovery still finds it.
        run: |
          brew install tmux fzf webtorrent-cli
          bash lib/fix-webtorrent.sh
      - name: run tests
        env:
          CI: "1"
        run: bash tests/run-all.sh
